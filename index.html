<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Weather</title><script defer="defer" src="main.js"></script></head><body><header><h1>Visual Weather</h1><div class="search-bar"><input name="city" value="mumbai" placeholder="Search"> <button aria-label="search"><span>Search</span> <span aria-hidden="true" class="spinner hide"></span></button> <span id="status" class="sr-only" aria-live="polite"></span></div></header><main><div class="weather-card hide"><div class="address"><img src="a2eec1be2591cea84bbb.svg" alt="" width="20" height="20"><p class="semi-bold"></p></div><div class="current-weather"><img alt="" class="weather-icon"><div><p class="curr-temp"></p><p class="feels-like text-secondary"></p></div><div class="dropdown-wrapper"><button class="toggle-btn" aria-label="Select temperature unit">⋮</button><div class="dropdown hide"><p><input type="radio" name="unit" id="fahrenheit-btn"> <label for="fahrenheit-btn">Fahrenheit – °F</label></p><p><input type="radio" name="unit" id="celsius-btn" checked="checked"> <label for="celsius-btn">Celsius – °C</label></p></div></div><div class="weather-summary"><p class="conditions semi-bold"></p><p class="desc text-secondary"></p></div><div class="weather-metrics"><div><img src="1ffab8c1bd2da74e0ca5.svg" alt="" width="20" height="20"><p class="precip value"></p><p class="label text-secondary">Precip</p></div><div><img src="945ac7277f859a52e1f5.svg" alt="" width="20" height="20"><p class="wind-speed value"></p><p class="label text-secondary">Wind</p></div><div><img src="ec726583ff92065f5f16.svg" alt="" width="20" height="20"><p class="humidity value"></p><p class="label text-secondary">Humidity</p></div><div><img src="b6efa1b20289d1a2df40.svg" alt="" width="20" height="20"><p class="uv-index value"></p><p class="label text-secondary">UV Index</p></div></div></div><div class="forecast"></div><p class="error-msg hide"></p></div></main><footer>© 2024 Muhammad Asad <a href="https://github.com/asadullahkhann"><img src="97ed8e7eef60d61ca469.svg" alt="github-mark" width="16" height="16"/></a></footer></body></html>
